[pytest]
testpaths = .
python_files = test_*.py
addopts = -ra --strict-markers
xfail_strict = true
console_output_style = classic
markers =
    lua: needs the LuaJIT build; skipped when run-lua is unavailable
    nolua: only meaningful when LuaJIT is disabled
    pty: attaches a client on a pseudo-terminal
