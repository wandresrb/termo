# termo system configuration. Loaded before any user config; the compiled-in
# defaults are tmux's, this is what makes termo feel modern out of the box.
# Override anything here in ~/.config/termo/termo.conf.

set -g history-limit 50000
set -g renumber-windows on
set -g escape-time 10
set -s focus-events on
set -s set-clipboard on
set -sa terminal-features ",*:256:RGB"

set -g mode-keys vi
set -g status-keys vi
bind -Tcopy-mode-vi v send -X begin-selection
bind -Tcopy-mode-vi y send -X copy-pipe-and-cancel
