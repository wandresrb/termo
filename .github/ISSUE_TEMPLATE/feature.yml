name: Feature request
description: A new capability or a change in behaviour
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The behaviour, option, command or `termo.api` function you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds you tried, including plain tmux configuration or a Lua snippet.
  - type: dropdown
    id: scope
    attributes:
      label: Core or plugin?
      description: Core is C in the server or terminal layer; a plugin is Lua on `termo.api` (see `docs/api.md`).
      options:
        - Core (C)
        - Lua plugin, possibly with a small API addition
        - Not sure
    validations:
      required: true
