name: nightly

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

# The container jobs run on the runner named by the repository variable
# TERMO_LINUX_RUNNER (a self-hosted label, or unset for GitHub's); nothing here
# runs on pull_request, so a self-hosted runner never executes a fork's code.
concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  image:
    uses: $/.github/workflows/image.yml
    permissions:
      contents: read
      packages: write

  fuzz:
    needs: image
    runs-on: ${{ vars.TERMO_LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/${{ github.repository }}-ci-ubuntu:${{ needs.image.outputs.ubuntu }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CC: clang-20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: meson setup build -Dfuzz=enabled -Db_sanitize=address,undefined -Dluajit=disabled
      - run: ninja -C build
      - name: fuzz 10 minutes per target
        run: |
          for t in cmd-parse format input style; do
            ./build/tests/$t-fuzzer -max_total_time=600 -max_len=512 \
              -dict=tests/fuzz/$t-fuzzer.dict tests/fuzz/corpus/$t
          done
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashes
          path: |
            crash-*
            leak-*
            timeout-*
            /tmp/termo-asan.*
          if-no-files-found: ignore

  variants:
    name: ${{ matrix.name }}
    needs: image
    runs-on: ${{ vars.TERMO_LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/${{ github.repository }}-ci-ubuntu:${{ needs.image.outputs.ubuntu }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: no-luajit-no-utf8proc
            opts: -Dluajit=disabled -Dutf8proc=disabled
          - name: sixel-release
            opts: -Dsixel=true -Dbuildtype=release
    env:
      CC: gcc-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: meson setup build -Dwerror=true -De2e=enabled ${{ matrix.opts }}
      - run: ninja -C build
      - run: meson test -C build --print-errorlogs
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logs-${{ matrix.name }}
          path: build/meson-logs/testlog.txt
          if-no-files-found: ignore

  alpine:
    name: alpine musl gcc
    needs: image
    runs-on: ${{ vars.TERMO_LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/${{ github.repository }}-ci-alpine:${{ needs.image.outputs.alpine }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: meson setup build -Dwerror=true -De2e=enabled
      - run: meson compile -C build
      - run: meson test -C build --print-errorlogs
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logs-alpine
          path: build/meson-logs/testlog.txt
          if-no-files-found: ignore

  freebsd:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: vmactions/freebsd-vm@f0552d3b69211736abd97f02ff3d4674c56b73b1 # v1.5.5
        with:
          usesh: true
          copyback: false
          prepare: pkg install -y meson ninja bison pkgconf libevent utf8proc luajit python3 py311-pytest
          run: |
            meson setup build -Dwerror=true -De2e=enabled
            ninja -C build
            meson test -C build --print-errorlogs
