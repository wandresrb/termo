name: nightly

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  image:
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      packages: write

  fuzz:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/${{ github.repository }}-ci-ubuntu:${{ needs.image.outputs.ubuntu }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CC: clang-20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: meson setup build -Dfuzz=enabled -Db_sanitize=address,undefined -Dluajit=disabled
      - run: ninja -C build
      - name: fuzz 10 minutes per target
        run: |
          for t in cmd-parse format input style; do
            ./build/tests/$t-fuzzer -max_total_time=600 -max_len=512 \
              -dict=tests/fuzz/$t-fuzzer.dict tests/fuzz/corpus/$t
          done
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashes
          path: |
            crash-*
            leak-*
            timeout-*
            /tmp/termo-asan.*
          if-no-files-found: ignore

  variants:
    name: ${{ matrix.name }}
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/${{ github.repository }}-ci-ubuntu:${{ needs.image.outputs.ubuntu }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: no-luajit-no-utf8proc
            opts: -Dluajit=disabled -Dutf8proc=disabled
          - name: sixel-release
            opts: -Dsixel=true -Dbuildtype=release
    env:
      CC: gcc-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: meson setup build -Dwerror=true -De2e=enabled ${{ matrix.opts }}
      - run: ninja -C build
      - run: meson test -C build --print-errorlogs
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logs-${{ matrix.name }}
          path: build/meson-logs/testlog.txt
          if-no-files-found: ignore

  clang-tidy:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/${{ github.repository }}-ci-ubuntu:${{ needs.image.outputs.ubuntu }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CC: clang-20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: meson setup build
      - run: ninja -C build cmd-parse.c
      - name: clang-tidy against the committed baseline
        run: |
          run-clang-tidy-20 -p build -quiet 'src/.*' > tidy.log 2>&1 || true
          count=$(grep -c 'warning:' tidy.log || true)
          echo "clang-tidy findings: $count" | tee -a "$GITHUB_STEP_SUMMARY"
          grep 'warning:' tidy.log | sed 's/^/    /' | head -50 >> "$GITHUB_STEP_SUMMARY" || true
          if [ -f tools/clang-tidy-baseline ]; then
            base=$(cat tools/clang-tidy-baseline)
            echo "baseline: $base" | tee -a "$GITHUB_STEP_SUMMARY"
            [ "$count" -le "$base" ] || { echo "more findings than the baseline"; exit 1; }
          else
            echo "no tools/clang-tidy-baseline yet: commit this count to start enforcing" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clang-tidy
          path: tidy.log

  alpine:
    name: alpine musl gcc
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/${{ github.repository }}-ci-alpine:${{ needs.image.outputs.alpine }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: meson setup build -Dwerror=true -De2e=enabled
      - run: meson compile -C build
      - run: meson test -C build --print-errorlogs
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logs-alpine
          path: build/meson-logs/testlog.txt
          if-no-files-found: ignore

  freebsd:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: vmactions/freebsd-vm@f0552d3b69211736abd97f02ff3d4674c56b73b1 # v1.5.5
        with:
          usesh: true
          copyback: false
          prepare: pkg install -y meson ninja bison pkgconf libevent utf8proc luajit python3 py311-pytest
          run: |
            meson setup build -Dwerror=true -De2e=enabled
            ninja -C build
            meson test -C build --print-errorlogs
