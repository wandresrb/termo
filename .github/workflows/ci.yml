name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} ${{ matrix.cc }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            cc: gcc-14
          - os: ubuntu-24.04
            cc: clang-18
          - os: macos-15
            cc: clang
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: dependencies (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.cc }} meson ninja-build bison pkg-config ccache \
            libevent-dev libncurses-dev libutf8proc-dev libluajit-5.1-dev
          # ASAN needs fewer ASLR bits than the runner kernel default
          sudo sysctl vm.mmap_rnd_bits=28

      - name: dependencies (macos)
        if: runner.os == 'macOS'
        run: brew install meson ninja bison pkg-config ccache libevent ncurses utf8proc luajit

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}-${{ matrix.cc }}

      - name: configure
        run: |
          extra=""
          [ "$RUNNER_OS" = macOS ] && extra="-Db_lundef=false"
          meson setup build -Db_sanitize=address,undefined -Dbuildtype=debugoptimized \
            -Dwerror=true $extra

      - name: build
        run: ninja -C build

      - name: test
        run: meson test -C build --print-errorlogs

      - name: logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: logs-${{ matrix.os }}-${{ matrix.cc }}
          path: |
            build/meson-logs/testlog.txt
            tests/regress/logs/
          if-no-files-found: ignore
