name: lintcommit

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: one line, imperative, under 72 chars, no body
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          rc=0
          for c in $(git rev-list "$BASE".."$HEAD"); do
            subject=$(git log -1 --format=%s "$c")
            body=$(git log -1 --format=%b "$c")
            if [ ${#subject} -gt 72 ]; then echo "$c: subject over 72 chars"; rc=1; fi
            if [ -n "$body" ]; then echo "$c: has a body; termo commits are one line"; rc=1; fi
            case "$subject" in
              *.) echo "$c: subject ends with a period"; rc=1 ;;
            esac
          done
          exit $rc
